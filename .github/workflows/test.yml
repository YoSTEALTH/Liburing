name: Test

# Push to dev first; merge/push to main only after this passes.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # lib/liburing (C liburing)

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Python 3.15t (free-threaded)
        id: py_ft
        uses: actions/setup-python@v7
        with:
          python-version: 3.15t
          allow-prereleases: true

      - name: Python 3.15 (GIL)
        id: py_gil
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Python 3.14t (free-threaded)
        id: py314_ft
        uses: actions/setup-python@v7
        with:
          python-version: 3.14t

      - name: Python 3.14 (GIL)
        id: py314_gil
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install tools
        run: |
          "${{ steps.py_ft.outputs.python-path }}" -m pip install pytest mypy
          "${{ steps.py_gil.outputs.python-path }}" -m pip install pytest
          "${{ steps.py314_ft.outputs.python-path }}" -m pip install pytest
          "${{ steps.py314_gil.outputs.python-path }}" -m pip install pytest

      - name: tools/check.sh
        env:
          PY_FT: ${{ steps.py_ft.outputs.python-path }}
          PY_GIL: ${{ steps.py_gil.outputs.python-path }}
          PY314_FT: ${{ steps.py314_ft.outputs.python-path }}
          PY314_GIL: ${{ steps.py314_gil.outputs.python-path }}
        run: tools/check.sh

  wheels:
    # Every release wheel ([tool.setu_build] in pyproject.toml); `wheel-test` installs and tests them.
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Python 3.15t (free-threaded)
        id: py_ft
        uses: actions/setup-python@v7
        with:
          python-version: 3.15t
          allow-prereleases: true

      - name: Build wheels
        run: '"${{ steps.py_ft.outputs.python-path }}" tools/setu_build.py --all -o dist'

      - uses: actions/upload-artifact@v6
        with:
          name: wheels
          path: dist/*.whl

  wheel-test:
    # The glibc wheel of each arch, installed and tested on its own hardware (aarch64: GitHub's arm64 runners;
    # qemu-user has no io_uring), on the oldest and newest Ubuntu images GitHub offers, for their kernels:
    # 22.04 is 6.8 (below README's 6.14: unsupported features must skip, not fail; unsupported from 2027-04-17,
    # then use the next oldest), 26.04 is 7.0 (2026-10). One `cp314.cp315-abi3.abi3t.cp314t.cp315t` wheel per
    # platform: any pip installs it on all four interpreters.
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7  # test/ only: no submodules, no zig

      - uses: actions/download-artifact@v6
        with:
          name: wheels
          path: dist

      - name: Python 3.15t (free-threaded)
        id: py_ft
        uses: actions/setup-python@v7
        with:
          python-version: 3.15t
          allow-prereleases: true

      - name: Python 3.15 (GIL)
        id: py_gil
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Python 3.14t (free-threaded)
        id: py314_ft
        uses: actions/setup-python@v7
        with:
          python-version: 3.14t

      - name: Python 3.14 (GIL)
        id: py314_gil
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test the installed wheel
        run: |
          uname -r  # the kernel under test
          wheel=$(ls dist/liburing-*-manylinux_2_28_"$(uname -m)".whl)
          mkdir -p "$RUNNER_TEMP/wheeltest" && cp -r test "$RUNNER_TEMP/wheeltest/"
          for py in "${{ steps.py_ft.outputs.python-path }}" "${{ steps.py_gil.outputs.python-path }}" \
                    "${{ steps.py314_ft.outputs.python-path }}" "${{ steps.py314_gil.outputs.python-path }}"; do
            venv="$RUNNER_TEMP/venv-$("$py" -c 'import sys; print(sys.implementation.cache_tag + sys.abiflags)')"
            "$py" -m venv "$venv"
            "$venv/bin/pip" install -U pip
            "$venv/bin/pip" install pytest "$wheel"
            (cd "$RUNNER_TEMP/wheeltest" && "$venv/bin/python" -m pytest test -rs -p no:cacheprovider)
          done
