[project]
name = "liburing"
readme = { file = "README.md", content-type = "text/markdown" }
license = "CC0-1.0"
dynamic = ["version"]  # from `build.zig.zon` (tools/setu_build.py)
authors = [{name="Ritesh"}]
keywords = ["python", "socket", "async", "file", "python3", "io", "syscall", "futex", "statx",
            "io-uring", "uring", "liburing"]
requires-python = ">=3.15"
license-files = ["LICENSE.txt"]
dependencies = []
description = "Liburing is Python + Zig wrapper around C Liburing, which is a helper to setup and tear-down io_uring instances."
classifiers = ["Topic :: Software Development",
               "Intended Audience :: Developers",
               "Operating System :: POSIX :: Linux",
               "Programming Language :: Python :: 3.15",
               "Programming Language :: Python :: Free Threading :: 1 - Unstable",  # 3.15t wheel, but the GIL stays on
               "Development Status :: 2 - Pre-Alpha"]
               # 1 - Planning
               # 2 - Pre-Alpha
               # 3 - Alpha
               # 4 - Beta
               # 5 - Production/Stable
               # 6 - Mature
               # 7 - Inactive

[project.urls]
Homepage = "https://github.com/YoSTEALTH/Liburing"
Issues = "https://github.com/YoSTEALTH/Liburing/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.ruff]
line-length = 120

[build-system]
requires = []  # `zig` 0.17.0 on PATH (or $ZIG); see tools/setu_build.py
build-backend = "setu_build"
backend-path = ["tools"]

[tool.setu_build]
# `--all`: cp315 / cp315t wheels for glibc 2.28+ on x86_64 and aarch64 (plan.md decision 7).
abis = ["cp315t", "cp315"]
targets = ["x86_64-linux-gnu.2.28", "aarch64-linux-gnu.2.28"]

[tool.pytest.ini_options]
pythonpath = ["src"]  # after `zig build develop`, tests run straight from the checkout
testpaths = ["test"]
