[project]
name = "liburing"
description = "Liburing is Python + Zig wrapper around C Liburing, which is a helper to setup and tear-down io_uring instances."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.14"
license = "CC0-1.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "YoSTEALTH" }]
keywords = ["async", "file", "futex", "io", "io-uring", "liburing", "python", "python3", "socket", "statx", "syscall", "uring"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 1 - Unstable",  # loads on 3.14t / 3.15t, but the GIL stays on
  "Topic :: Software Development"
]
dependencies = []
dynamic = ["version"]  # from `build.zig.zon` (tools/setu_build.py)
# 1 - Planning
# 2 - Pre-Alpha
# 3 - Alpha
# 4 - Beta
# 5 - Production/Stable
# 6 - Mature
# 7 - Inactive

[project.urls]
Homepage = "https://github.com/YoSTEALTH/Liburing"
Issues = "https://github.com/YoSTEALTH/Liburing/issues"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = []  # `zig` 0.17.0 on PATH (or $ZIG); see tools/setu_build.py
build-backend = "setu_build"
backend-path = ["tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]  # after `zig build develop`, tests run straight from the checkout
testpaths = ["test"]
addopts = "-rs"  # list each skip with its reason (`UnsupportedError`, `skip_linux`, ...)

[tool.ruff]
line-length = 120

[tool.setu_build]
# `--all`: one `cp314.cp315-abi3.abi3t.cp314t.cp315t` wheel (3.14, 3.14t, 3.15, 3.15t and later) for glibc 2.28+
# on x86_64 and aarch64 (plan.md decision 7).
targets = ["x86_64-linux-gnu.2.28", "aarch64-linux-gnu.2.28"]
